name: Frontend quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm install
      - name: Frontend static release gate
        run: node scripts/audit_frontend_release.mjs
      - name: Pseudo-locale contract
        run: node scripts/audit_frontend_pseudo_locale.mjs
      - name: Autocomplete and YAML context tests
        run: node tests/js/autocomplete_context.mjs
      - name: AI mode interaction tests
        run: node tests/js/ai_modes.mjs
