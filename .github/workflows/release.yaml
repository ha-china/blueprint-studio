name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and attach release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build blueprint_studio.zip
        run: |
          cd custom_components/blueprint_studio
          zip -r ../../blueprint_studio.zip . \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.DS_Store*" \
            -x "*.claude*"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: blueprint_studio.zip
